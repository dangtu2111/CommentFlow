[project]
name = "flow-ml"
version = "0.0.0"
description = "Dịch vụ ml của CommentFlow (FastAPI). Giai đoạn khung: chỉ có /health, chưa nạp model."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
embed = [
    "sentence-transformers==6.2.0",
    "torch>=2.15,<2.16",
]

# torch bản CPU cho Linux (Docker): tránh kéo ~15 gói CUDA/NVIDIA không dùng tới.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
    "ruff==0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
