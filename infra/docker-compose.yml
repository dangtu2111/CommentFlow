# Compose nền của CommentFlow — KHÔNG publish cổng nào ra máy chủ (xem docker-compose.dev.yml).
# Chạy với: docker compose -p cf-dev --env-file .env.cf-dev -f infra/docker-compose.yml -f infra/docker-compose.dev.yml up -d
# Biến môi trường (mật khẩu, khóa) nằm trong .env.cf-dev trên máy ảo, sinh bởi scripts/cf-dev-env-init.sh.
# Tên biến + mô tả: infra/env.cf-dev.example. Xem docs/decisions/001-stack.md §4–5.

x-langfuse-env: &langfuse-env
  NEXTAUTH_URL: ${LANGFUSE_PUBLIC_URL:?}
  DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD:?}@postgres:5432/langfuse
  SALT: ${LANGFUSE_SALT:?}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?}
  TELEMETRY_ENABLED: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: langfuse
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: valkey
  REDIS_PORT: "6379"
  REDIS_AUTH: ${VALKEY_PASSWORD:?}
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://seaweedfs:8333
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?}
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://seaweedfs:8333
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?}
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?}
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    restart: unless-stopped
    mem_limit: 1g
    environment:
      TZ: UTC
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      CF_DATABASES: ${CF_DATABASES:?}
      CF_OWNER_PASSWORD: ${CF_OWNER_PASSWORD:?}
      CF_APP_PASSWORD: ${CF_APP_PASSWORD:?}
      CF_AUTH_PASSWORD: ${CF_AUTH_PASSWORD:?}
      CF_WORKER_PASSWORD: ${CF_WORKER_PASSWORD:?}
      LITELLM_DB_PASSWORD: ${LITELLM_DB_PASSWORD:?}
      LANGFUSE_DB_PASSWORD: ${LANGFUSE_DB_PASSWORD:?}
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=100"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Kiểm qua TCP (-h 127.0.0.1): máy chủ tạm lúc chạy script khởi tạo chỉ nghe socket nên chưa tính là sẵn sàng.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  valkey:
    image: valkey/valkey:8.1.11-alpine
    restart: unless-stopped
    mem_limit: 256m
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?}
    # noeviction: bắt buộc với Langfuse (BullMQ). maxmemory < giới hạn container để lỗi ghi thay vì bị OOM kill.
    command:
      - sh
      - -c
      - exec valkey-server --requirepass "$$VALKEY_PASSWORD" --maxmemory 192mb --maxmemory-policy noeviction --appendonly yes
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD-SHELL", 'valkey-cli -a "$$VALKEY_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:26.3.62.3
    restart: unless-stopped
    user: "101:101"
    mem_limit: 1536m
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?}
    volumes:
      - chdata:/var/lib/clickhouse
      - chlogs:/var/log/clickhouse-server
      - ./clickhouse/low-resource.xml:/etc/clickhouse-server/config.d/low-resource.xml:ro
    healthcheck:
      test:
        ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # S3 tương thích cho Langfuse (thay MinIO đã ngừng — docs/decisions/001-stack.md §3).
  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    restart: unless-stopped
    mem_limit: 512m
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
    entrypoint: ["/bin/sh", "-c"]
    # File danh tính được tạo trong container từ biến môi trường (không lưu bí mật ra đĩa máy chủ);
    # nếu thiếu file này thì S3 của SeaweedFS không xác thực.
    command:
      - |
        cat > /tmp/s3.json <<JSON
        {"identities":[{"name":"langfuse","credentials":[{"accessKey":"$$S3_ACCESS_KEY","secretKey":"$$S3_SECRET_KEY"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        JSON
        exec weed server -dir=/data -master.volumeSizeLimitMB=512 -volume.max=20 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    volumes:
      - s3data:/data
    healthcheck:
      # SeaweedFS nghe trên IP container (không phải localhost) nên kiểm qua `hostname -i`.
      test:
        [
          "CMD-SHELL",
          "IP=$$(hostname -i) && wget -q -O /dev/null http://$$IP:9333/cluster/status && nc -z $$IP 8333",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  seaweedfs-init:
    image: chrislusf/seaweedfs:4.52
    restart: "no"
    mem_limit: 128m
    depends_on:
      seaweedfs: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "s3.bucket.create -name langfuse" | weed shell -master=seaweedfs:9333
        echo "s3.bucket.list" | weed shell -master=seaweedfs:9333 | grep -q langfuse

  litellm:
    image: ghcr.io/berriai/litellm:v1.106.6
    restart: unless-stopped
    mem_limit: 1280m
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD:?}@postgres:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?}
      REDIS_HOST: valkey
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${VALKEY_PASSWORD:?}
      CACHE_NAMESPACE: ${CACHE_NAMESPACE:?}
      # Khóa nhà cung cấp LLM (tùy chọn, chỉ điền nhà cung cấp muốn đo; để trống thì chỉ dùng được mock-llm).
      # Chỉ có trên máy ảo, không bao giờ commit.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LANGFUSE_HOST: http://langfuse-web:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:?}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:?}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=4)",
        ]
      interval: 10s
      timeout: 6s
      retries: 20
      start_period: 60s

  ml:
    build:
      context: ../services/ml
    image: cf/ml:local
    restart: unless-stopped
    # bge-m3 (embedding) cần ~2,5–3 GB RAM khi nạp; không bật ML_EMBED_ENABLED thì dịch vụ chỉ dùng vài chục MB.
    mem_limit: 3g
    environment:
      # Mặc định TẮT: không nạp model nặng ngoài ý muốn. Bật bằng ML_EMBED_ENABLED=true trong .env.cf-dev.
      ML_EMBED_ENABLED: ${ML_EMBED_ENABLED:-false}
      # Tùy chọn: đặt thì /embed bắt buộc `Authorization: Bearer <token>` (app dùng cùng giá trị ở ML_API_TOKEN).
      ML_API_TOKEN: ${ML_API_TOKEN:-}
    volumes:
      - ml-models:/models
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Langfuse chỉ nghe trên tên host của container (không phải localhost) → healthcheck dùng $HOSTNAME.
  langfuse-worker:
    image: langfuse/langfuse-worker:4.72.0
    restart: unless-stopped
    mem_limit: 768m
    depends_on: &langfuse-depends
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      seaweedfs-init: { condition: service_completed_successfully }
    environment:
      <<: *langfuse-env
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://$$HOSTNAME:3030/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s

  langfuse-web:
    image: langfuse/langfuse:4.72.0
    restart: unless-stopped
    # 1 GB làm Node hết heap (OOM, đã gặp khi dựng cf-dev) → 2 GB, heap tối đa 1,5 GB.
    mem_limit: 2g
    depends_on: *langfuse-depends
    environment:
      <<: *langfuse-env
      NODE_OPTIONS: --max-old-space-size=1536
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?}
      AUTH_DISABLE_SIGNUP: "true"
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:?}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:?}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:?}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:?}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:?}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:?}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:?}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:?}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:?}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://$$HOSTNAME:3000/api/public/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

volumes:
  pgdata:
  valkeydata:
  chdata:
  chlogs:
  s3data:
  ml-models: # cache mô hình bge-m3 (tải một lần ~2,3 GB)
