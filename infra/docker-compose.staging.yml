# Ghi đè cho project cf-staging (docs/15 §2, §5): thêm web + worker (+ khung cloudflared) lên compose nền.
# Chỉ MỘT cổng được publish: Postgres, và CHỈ ở 127.0.0.1 của máy ảo (cho runner migrate-staging cùng máy; tuyệt đối không
# 0.0.0.0 — scripts/lib/compose-ports.test.mjs kiểm). Web KHÔNG publish: chỉ truy cập được qua cloudflared cùng mạng Compose
# (CLIENT_IP_SOURCE=cf-connecting-ip chỉ an toàn khi đúng như vậy — ADR 004 §2). Không có Mailpit ở staging (chỉ ở docker-compose.dev.yml): SMTP thật qua biến SMTP_*.
#
# CHƯA CHẠY ở đâu cả (H5 phần không cần tên miền). Cách dùng khi bật (trên máy ảo, do deploy-staging hoặc chủ dự án):
#   docker compose -p cf-staging --env-file .env.cf-staging -f infra/docker-compose.yml -f infra/docker-compose.staging.yml up -d --build
#   (thêm `--profile tunnel` khi đã có tên miền + token cloudflared)
# Biến: tên + mô tả ở infra/env.cf-staging.example; file thật `.env.cf-staging` chỉ nằm trên máy ảo, không commit.
# Migration + `queue:install` KHÔNG chạy trong compose này: CLI hiện từ chối APP_ENV=staging (migration-guard) — xem
# docs/staging/H5-CHECKLIST.md mục "Migration lên staging".

# Anchor chung CHỈ gồm biến không phải thông tin đăng nhập DB: mỗi service tự nhận URL DB của role mình (ADR 011 §3) —
# web chỉ cf_app/cf_auth, worker chỉ cf_worker (không DATABASE_URL: worker không đọc biến này).
# Dịch vụ dùng chung (LiteLLM, ml, SeaweedFS S3) của project cf-dev CÙNG MÁY ẢO: truy cập qua cổng đã publish trên máy ảo bằng `host.docker.internal` (không nối mạng Docker của cf-dev
# để tên `postgres`/`valkey` của hai project không lẫn nhau). Khóa/URL ghi đè được bằng .env.cf-staging; để trống/tắt thì tính năng AI/ảnh-video tắt kèm lý do (không bản giả).
x-app-env: &app-env
  APP_ENV: staging
  TOKEN_ENC_KEYS: ${TOKEN_ENC_KEYS:-}
  LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://host.docker.internal:4000}
  LITELLM_API_KEY: ${LITELLM_API_KEY:-}
  CLASSIFY_LLM_MODEL: ${CLASSIFY_LLM_MODEL:-cf-classify}
  DRAFT_LLM_MODEL: ${DRAFT_LLM_MODEL:-cf-draft}
  REWRITE_LLM_MODEL: ${REWRITE_LLM_MODEL:-cf-classify}
  DISTILL_LLM_MODEL: ${DISTILL_LLM_MODEL:-cf-draft}
  CAPTION_LLM_MODEL: ${CAPTION_LLM_MODEL:-cf-draft}
  ML_URL: ${ML_URL:-http://host.docker.internal:8001}
  ML_EMBED_ENABLED: ${ML_EMBED_ENABLED:-true}
  ML_RERANK_ENABLED: ${ML_RERANK_ENABLED:-true}
  MEDIA_S3_ENDPOINT: ${MEDIA_S3_ENDPOINT:-http://host.docker.internal:8333}
  MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-cf-media-staging}
  MEDIA_S3_ACCESS_KEY: ${MEDIA_S3_ACCESS_KEY:-}
  MEDIA_S3_SECRET_KEY: ${MEDIA_S3_SECRET_KEY:-}
  FB_CONNECTOR_ENABLED: ${FB_CONNECTOR_ENABLED:-false}
  FB_PUBLISH_ENABLED: ${FB_PUBLISH_ENABLED:-false}
  SHOPIFY_ENABLED: ${SHOPIFY_ENABLED:-false}
  POLLING_ENABLED: ${POLLING_ENABLED:-false}
  SEND_RATE_LIMIT_ENABLED: ${SEND_RATE_LIMIT_ENABLED:-false}
  LEADS_CAPTURE_ENABLED: ${LEADS_CAPTURE_ENABLED:-false}
  LEADS_EXPORT_ENABLED: ${LEADS_EXPORT_ENABLED:-false}
  DATA_EXPORT_ENABLED: ${DATA_EXPORT_ENABLED:-false}

services:
  postgres:
    # Cổng cho CLI migrate staging: CF_STAGING_DB_HOSTS=127.0.0.1:<CF_STAGING_DB_PORT> (mặc định 5434). Chỉ loopback.
    ports: ["127.0.0.1:${CF_STAGING_DB_PORT:-5434}:5432"]

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: cf/web:${IMAGE_TAG:-local}
    restart: unless-stopped
    mem_limit: 768m
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      <<: *app-env
      DATABASE_URL: postgresql://cf_app:${CF_APP_PASSWORD:?}@postgres:5432/${CF_APP_DATABASE:?}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?}
      DATABASE_AUTH_URL: postgresql://cf_auth:${CF_AUTH_PASSWORD:?}@postgres:5432/${CF_APP_DATABASE:?}
      REDIS_URL: redis://:${VALKEY_PASSWORD:?}@valkey:6379/0
      REDIS_KEY_PREFIX: "staging:"
      CLIENT_IP_SOURCE: ${CLIENT_IP_SOURCE:-none}
      PWNED_CHECK: "on"
      SMTP_HOST: ${SMTP_HOST:?}
      SMTP_PORT: ${SMTP_PORT:?}
      SMTP_FROM: ${SMTP_FROM:?}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
      FB_OAUTH_ENABLED: ${FB_OAUTH_ENABLED:-false}
      META_OAUTH_REDIRECT_URL: ${META_OAUTH_REDIRECT_URL:-}
      FB_LOGIN_CONFIG_ID: ${FB_LOGIN_CONFIG_ID:-}
    # Cố ý KHÔNG có `ports:` — xem ghi chú đầu file.

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    image: cf/worker:${IMAGE_TAG:-local}
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      postgres: { condition: service_healthy }
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      <<: *app-env
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_PORT: "3001"
      # Role cf_worker (ADR 011): CHỈ worker nhận mật khẩu này; web không có biến CF_WORKER_PASSWORD/DATABASE_WORKER_URL.
      DATABASE_WORKER_URL: postgresql://cf_worker:${CF_WORKER_PASSWORD:?}@postgres:5432/${CF_APP_DATABASE:?}

  # Khung Cloudflare Tunnel: chỉ chạy khi bật profile `tunnel` (chưa có tên miền/token nên mặc định không chạy).
  # Khi bật: ghim lại phiên bản image theo bản mới nhất đã kiểm, đặt CLOUDFLARE_TUNNEL_TOKEN trong .env.cf-staging,
  # cấu hình route (hostname → http://web:3000) trong Cloudflare Zero Trust.
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:2025.11.1
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      web: { condition: service_healthy }
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    command: ["tunnel", "--no-autoupdate", "run"]
