# LiteLLM proxy — cấu hình khung. Chưa có khóa nhà cung cấp LLM thật.
# `mock-llm` trả lời cố định, không gọi nhà cung cấp, không tốn tiền (dùng cho test/CI).
model_list:
  - model_name: mock-llm
    litellm_params:
      model: openai/mock-llm
      api_key: mock-not-a-real-key
      mock_response: "Đây là phản hồi giả để kiểm thử."
  # Gemini thật (TRY-AI-REAL lát C). Tên `cf-classify`/`cf-draft` là bí danh ổn định app gọi tới (CLASSIFY_LLM_MODEL /
  # DRAFT_LLM_MODEL); đổi model chỉ cần sửa dòng `model:` bên dưới. Cần GEMINI_API_KEY ở máy ảo; khóa ảo của app
  # (LITELLM_API_KEY) tạo trong LiteLLM kèm max_budget để chặn chi phí. Kiểm lại tên model trên tài liệu Google/LiteLLM.
  - model_name: cf-classify
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
  - model_name: cf-draft
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

litellm_settings:
  # Cache dùng Valkey; mọi khóa có tiền tố theo môi trường (dev:… / staging:…).
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    password: os.environ/REDIS_PASSWORD
    namespace: os.environ/CACHE_NAMESPACE
  # Gửi trace sang Langfuse (đọc LANGFUSE_HOST / LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY từ môi trường).
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]
