# LiteLLM proxy — cấu hình khung. Chưa có khóa nhà cung cấp LLM thật.
# `mock-llm` trả lời cố định, không gọi nhà cung cấp, không tốn tiền (dùng cho test/CI).
model_list:
  - model_name: mock-llm
    litellm_params:
      model: openai/mock-llm
      api_key: mock-not-a-real-key
      mock_response: "Đây là phản hồi giả để kiểm thử."
  # ỨNG VIÊN LLM theo spec 12 §8 (chốt 02/11): KHÔNG chốt cứng một model — chọn theo kết quả bộ đánh giá (14 §4, EVAL-RUNNER).
  # Mỗi ứng viên là một bí danh `cand-*`; app chọn bằng CLASSIFY_LLM_MODEL / DRAFT_LLM_MODEL (đổi model KHÔNG sửa code,
  # chỉ đổi biến môi trường). Ứng viên nào thiếu khóa nhà cung cấp thì không gọi được (lỗi 401 ở bước gọi) — chỉ điền khóa
  # của nhà cung cấp bạn muốn đo. Kiểm lại tên model trên tài liệu nhà cung cấp/LiteLLM trước khi dùng.
  - model_name: cand-claude-haiku
    litellm_params:
      model: anthropic/claude-haiku-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: cand-gpt-nano
    litellm_params:
      model: openai/gpt-5-nano
      api_key: os.environ/OPENAI_API_KEY
  - model_name: cand-gpt-mini
    litellm_params:
      model: openai/gpt-5-mini
      api_key: os.environ/OPENAI_API_KEY
  - model_name: cand-gemini-flash-lite
    litellm_params:
      model: gemini/gemini-2.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

litellm_settings:
  # Cache dùng Valkey; mọi khóa có tiền tố theo môi trường (dev:… / staging:…).
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    password: os.environ/REDIS_PASSWORD
    namespace: os.environ/CACHE_NAMESPACE
  # Gửi trace sang Langfuse (đọc LANGFUSE_HOST / LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY từ môi trường).
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]
