  #   config: { backend: litellm, classifyModel: cf-classify, rewriteModel: cf-classify, draftModel: cf-draft, variantCount: 4 }
  # - id: file://provider.mjs
  #   label: luna (extract + draft)
  #   config: { backend: litellm, classifyModel: cand-gpt-luna, rewriteModel: cand-gpt-luna, draftModel: cf-draft, variantCount: 4 }

tests: file://tests.json
