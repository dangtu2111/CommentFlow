# Quét bí mật bằng bộ luật mặc định của gitleaks (AGENTS.md: không commit khóa/token).
title = "CommentFlow gitleaks"

[extend]
useDefault = true

[[allowlists]]
description = "Giá trị mẫu cố ý trong env.example (không phải bí mật thật)"
paths = ['''(^|/)env\.example$''', '''(^|/)infra/env\.cf-dev\.example$''']

[[allowlists]]
description = "Khóa ký GIẢ cho test auth đã nằm trong lịch sử git (commit db5de97); nay test sinh khóa ngẫu nhiên lúc chạy"
regexes = ['''khoa-thu-nghiem-khong-phai-bi-mat-that-0123456789''']

[[allowlists]]
description = "Vector thử CÔNG KHAI của RFC 6238 (ASCII '12345678901234567890' dạng base32) trong test TOTP của e2e — không phải bí mật; chỉ áp cho đúng file test"
paths = ['''(^|/)e2e/support/totp\.test\.ts$''']
regexes = ['''GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ''']

[[allowlists]]
description = "Tên trường tín hiệu 'sRetrievalTop2' đứng cạnh biến `key` trong test độ tin cậy (commit 8a7dbb2) bị luật generic-api-key bắt nhầm — là tên thuộc tính, không phải bí mật; chỉ áp cho đúng dòng trong đúng file test"
matchCondition = "AND"
regexTarget = "line"
paths = ['''(^|/)packages/ai/src/confidence/confidence\.test\.ts$''']
regexes = ['''sRetrievalTop2''']

[[allowlists]]
description = "Token mời GIẢ 'inv_annhien_…' (dummyToken) trong HTML mẫu Stitch của email mời, nằm ở nhánh chore/stitch-fetch-html (gitleaks quét mọi nhánh) — dữ liệu minh họa, không phải bí mật; chỉ áp cho đúng file thiết kế"
paths = ['''(^|/)design/stitch/email-invite\.html$''']
regexes = ['''inv_annhien_[0-9a-f]+''']

[[allowlists]]
description = "Khóa GIẢ 'tiktok-bi-mat-gia-…' trong test cấu hình/registry connector TikTok (commit f975b1c, nhánh feat-tiktok-connector; gitleaks quét mọi nhánh) — giá trị minh họa, không phải bí mật; chỉ áp cho đúng hai file test"
paths = ['''(^|/)apps/worker/src/config\.test\.ts$''', '''(^|/)apps/worker/src/channels/connector-registry\.test\.ts$''']
regexes = ['''tiktok-bi-mat-gia-[0-9]+''']
