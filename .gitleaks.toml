# Quét bí mật bằng bộ luật mặc định của gitleaks (AGENTS.md: không commit khóa/token).
title = "CommentFlow gitleaks"

[extend]
useDefault = true

[[allowlists]]
description = "Giá trị mẫu cố ý trong env.example (không phải bí mật thật)"
paths = ['''(^|/)env\.example$''', '''(^|/)infra/env\.cf-dev\.example$''']

[[allowlists]]
description = "Khóa ký GIẢ cho test auth đã nằm trong lịch sử git (commit db5de97); nay test sinh khóa ngẫu nhiên lúc chạy"
regexes = ['''khoa-thu-nghiem-khong-phai-bi-mat-that-0123456789''']

[[allowlists]]
description = "Vector thử CÔNG KHAI của RFC 6238 (ASCII '12345678901234567890' dạng base32) trong test TOTP của e2e — không phải bí mật; chỉ áp cho đúng file test"
paths = ['''(^|/)e2e/support/totp\.test\.ts$''']
regexes = ['''GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ''']

[[allowlists]]
description = "Tên khóa thuộc tính trong test property-based (fast-check constantFrom) bị nhận nhầm là generic-api-key — không phải bí mật; chỉ áp cho đúng file test"
paths = ['''(^|/)packages/ai/src/confidence/confidence\.test\.ts$''']
