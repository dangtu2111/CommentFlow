name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Node (lint, typecheck, test, ranh giới, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # cổng kế hoạch đọc lịch sử nhánh (plan từng được thêm)
      - name: Bật corepack (ghim pnpm theo trường packageManager)
        run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Biome (lint + format)
        run: pnpm lint
      - name: Chuỗi giao diện viết cứng (ESLint, chỉ apps/web)
        run: pnpm lint:i18n
      - run: pnpm typecheck
      - name: Test (gồm test khớp khóa vi/en)
        run: pnpm test
      - name: Ngưỡng coverage (packages/ai, shared, saas-core; ratchet, docs/testing/STANDARD.md §8)
        run: pnpm test:coverage
      - name: Truy vết FR → test (mã FR mới Xong phải có test mang mã; nợ cũ ở trace-baseline.json)
        run: pnpm test:trace
      - name: Ranh giới gói (dependency-cruiser)
        run: pnpm depcruise
      - name: Cổng kế hoạch (plan đã duyệt hết điểm chưa rõ; nhánh feat/*, chore/* có plan)
        run: pnpm check:plans
      - name: Bản ghép codemap + QUYET_DINH khớp các file nhỏ (docs/codemap.d, docs/plans/quyet-dinh)
        run: pnpm codemap:check && pnpm quyet:check
      - name: Cổng số migration (liên tục, không trùng, khớp journal)
        run: pnpm check:migrations
      - run: pnpm build

  python:
    name: Python (ml)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cài uv (ghim phiên bản)
        run: pipx install uv==0.13.6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  database:
    name: Database (migration, RLS, test tích hợp)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_PASSWORD: ci-superuser-only-in-this-job
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # Valkey cho test tích hợp rate limit (cùng phiên bản với cf-dev/cf-staging)
      valkey:
        image: valkey/valkey:8.1.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: ci
      PGHOST: localhost
      PGPORT: "5432"
      PGPASSWORD: ci-superuser-only-in-this-job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bật corepack (ghim pnpm theo trường packageManager)
        run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sinh mật khẩu ngẫu nhiên cho role cf_owner/cf_app/cf_auth/cf_worker (chỉ dùng trong job này)
        run: |
          OWNER_PW="$(openssl rand -hex 24)"
          APP_PW="$(openssl rand -hex 24)"
          AUTH_PW="$(openssl rand -hex 24)"
          WORKER_PW="$(openssl rand -hex 24)"
          echo "::add-mask::$OWNER_PW"
          echo "::add-mask::$APP_PW"
          echo "::add-mask::$AUTH_PW"
          echo "::add-mask::$WORKER_PW"
          {
            echo "CF_OWNER_PASSWORD=$OWNER_PW"
            echo "CF_APP_PASSWORD=$APP_PW"
            echo "CF_AUTH_PASSWORD=$AUTH_PW"
            echo "CF_WORKER_PASSWORD=$WORKER_PW"
            echo "DATABASE_ADMIN_URL=postgresql://cf_owner:$OWNER_PW@localhost:5432/cf_ci"
            echo "TEST_DATABASE_ADMIN_URL=postgresql://cf_owner:$OWNER_PW@localhost:5432/cf_ci"
            echo "TEST_DATABASE_URL=postgresql://cf_app:$APP_PW@localhost:5432/cf_ci"
            echo "TEST_DATABASE_AUTH_URL=postgresql://cf_auth:$AUTH_PW@localhost:5432/cf_ci"
            echo "TEST_DATABASE_WORKER_URL=postgresql://cf_worker:$WORKER_PW@localhost:5432/cf_ci"
            echo "DATABASE_AUTH_URL=postgresql://cf_auth:$AUTH_PW@localhost:5432/cf_ci"
            echo "DATABASE_URL=postgresql://cf_app:$APP_PW@localhost:5432/cf_ci"
            echo "REDIS_URL=redis://localhost:6379/0"
            echo "REDIS_KEY_PREFIX=ci:"
          } >> "$GITHUB_ENV"
      - name: Tạo role và database như trên máy ảo (cùng script khởi tạo)
        env:
          POSTGRES_USER: postgres
          CF_DATABASES: cf_ci
          LITELLM_DB_PASSWORD: ci-unused
          LANGFUSE_DB_PASSWORD: ci-unused
        run: bash infra/postgres/init/10-roles-and-databases.sh
      - name: Migration
        run: pnpm db:migrate
      - name: Kiểm RLS (mọi bảng có workspace_id phải có RLS + policy)
        run: pnpm db:check-rls
      - name: Cài pg-boss và hàng đợi
        run: pnpm --filter @flow/worker queue:install
      - name: Test tích hợp (RLS chéo workspace, auth, flags, ai_usage, hàng đợi)
        run: pnpm test:db

  e2e:
    name: E2E (Playwright + Chromium, Postgres, Valkey, Mailpit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_PASSWORD: ci-superuser-only-in-this-job
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # Valkey (không phải Redis — ADR 001) cho rate limit của web
      valkey:
        image: valkey/valkey:8.1.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # Hộp thư giả nhận email xác minh/lời mời (cùng phiên bản với cf-dev)
      mailpit:
        image: axllent/mailpit:v1.33.0
        env:
          MP_MAX_MESSAGES: "500"
          MP_SMTP_AUTH_ACCEPT_ANY: "1"
          MP_SMTP_AUTH_ALLOW_INSECURE: "1"
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGPASSWORD: ci-superuser-only-in-this-job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bật corepack (ghim pnpm theo trường packageManager)
        run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sinh mật khẩu/khóa ngẫu nhiên và biến cho E2E (chỉ dùng trong job này)
        run: |
          OWNER_PW="$(openssl rand -hex 24)"
          APP_PW="$(openssl rand -hex 24)"
          AUTH_PW="$(openssl rand -hex 24)"
          WORKER_PW="$(openssl rand -hex 24)"
          SECRET="$(openssl rand -hex 32)"
          for v in "$OWNER_PW" "$APP_PW" "$AUTH_PW" "$WORKER_PW" "$SECRET"; do echo "::add-mask::$v"; done
          {
            echo "CF_OWNER_PASSWORD=$OWNER_PW"
            echo "CF_APP_PASSWORD=$APP_PW"
            echo "CF_AUTH_PASSWORD=$AUTH_PW"
            echo "CF_WORKER_PASSWORD=$WORKER_PW"
            echo "TEST_DATABASE_ADMIN_URL=postgresql://cf_owner:$OWNER_PW@localhost:5432/cf_test"
            echo "TEST_DATABASE_URL=postgresql://cf_app:$APP_PW@localhost:5432/cf_test"
            echo "TEST_DATABASE_AUTH_URL=postgresql://cf_auth:$AUTH_PW@localhost:5432/cf_test"
            echo "REDIS_URL=redis://localhost:6379/0"
            echo "SMTP_HOST=localhost"
            echo "SMTP_PORT=1025"
            echo "MAILPIT_URL=http://localhost:8025"
            echo "BETTER_AUTH_SECRET=$SECRET"
          } >> "$GITHUB_ENV"
      - name: Tạo role và database cf_test như trên máy ảo (cùng script khởi tạo)
        env:
          POSTGRES_USER: postgres
          CF_DATABASES: cf_test
          LITELLM_DB_PASSWORD: ci-unused
          LANGFUSE_DB_PASSWORD: ci-unused
        run: bash infra/postgres/init/10-roles-and-databases.sh
      - name: Cài Chromium (kèm thư viện hệ thống)
        run: pnpm --filter @flow/e2e exec playwright install --with-deps chromium
      - name: E2E cổng 0 (migrate cf_test → next build/start → Playwright vi + en)
        run: pnpm e2e
      - name: Báo cáo Playwright (khi lỗi)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
          if-no-files-found: ignore

  gitleaks:
    name: Quét bí mật (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tải gitleaks và kiểm checksum
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Quét toàn bộ lịch sử git
        run: ./gitleaks git --config .gitleaks.toml --redact --verbose .
